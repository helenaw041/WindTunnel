<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Control</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <nav class="navigation">
        <a href ="./index.html" class="nav-button ">Home</a>
        <a href="./maintenance.html" class="nav-button">Maintenance</a>
        <a href="./manual.html" class="nav-button">Manual Control</a>
        <a href="./profile.html" class="nav-button">Profile Control</a>
        <a href="./settings.html" class="nav-button">Settings</a>
    </nav>

  <div class="control-container">
    <div class="label">Wind Speed Control</div>
    <input type="range" min="0" max="100" value="50" id="speedSlider" />
    <div class="readout">Current Speed: <span id="speedValue">50</span>%</div>

    <div class="speed-input">
      <input type="number" id="speedInput" min="0" max="100" placeholder="Enter %" />
      <button onclick="applySpeed()">Apply</button>
    </div>
  </div>

  <script>
    const slider = document.getElementById("speedSlider");
    const speedValue = document.getElementById("speedValue");
    const speedInput = document.getElementById("speedInput");

    slider.addEventListener("input", () => {
      const value = slider.value;
      speedValue.textContent = value;
    });
  </script>
</body>
</html>
